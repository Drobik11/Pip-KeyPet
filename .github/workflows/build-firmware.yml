name: Зібрати прошивку для сайту
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  # на чистому сервері менеджер компонентів не вміє перевіряти нові версії (немає sdkconfig):
  # беремо точні версії з firmware/dependencies.lock
  IDF_COMPONENT_CHECK_NEW_VERSION: "0"
  KEYPET_PUBLIC: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Збірка (з повним логом)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          cd firmware
          # перший прохід завантажує компоненти, другий уже бачить їхні налаштування
          idf.py -B build-release reconfigure 2>&1 | tail -n 30 || true
          idf.py -B build-release reconfigure 2>&1 | tail -n 30
          test ${PIPESTATUS[0]} -eq 0
          idf.py -B build-release build 2>&1 | tail -n 60
          test ${PIPESTATUS[0]} -eq 0
      - name: Пакування для сайту
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          bash tools/release.sh
      - name: Зберегти docs/firmware/firmware.js
        run: |
          git config user.name "firmware-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/firmware/firmware.js
          git commit -m "Прошивка для сайту: українська + шпалери" || echo "без змін"
          git push
