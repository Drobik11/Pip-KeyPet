name: Зібрати прошивку для сайту
on:
  workflow_dispatch:        # кнопка «Run workflow» на вкладці Actions
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    steps:
      - uses: actions/checkout@v4
      - name: Збірка (tools/release.sh)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . $IDF_PATH/export.sh
          bash tools/release.sh
      - name: Зберегти docs/firmware/firmware.js
        run: |
          git config user.name "firmware-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/firmware/firmware.js
          git commit -m "Прошивка для сайту: українська + шпалери" || echo "без змін"
          git push
