<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шпалери для Піпа</title>
<style>
 body{font:16px system-ui,sans-serif;background:#111;color:#eee;max-width:560px;margin:24px auto;padding:0 16px}
 canvas{width:310px;height:310px;border-radius:50%;background:#000;display:block;margin:12px auto;touch-action:none;cursor:grab}
 label{display:block;margin:10px 0 2px}input[type=range]{width:100%}
 button{font:inherit;padding:10px 16px;margin:6px 6px 0 0;border-radius:8px;border:0;background:#0a84ff;color:#fff}
 button.g{background:#333}button:disabled{opacity:.4}
 input[type=text]{font:inherit;width:9em}pre{background:#000;padding:8px;border-radius:8px;white-space:pre-wrap;min-height:3em}
</style></head><body>
<h1>Шпалери для Піпа</h1>
<p>Оберіть фото, посуньте його пальцем чи мишею в колі, налаштуйте яскравість і прошийте. Потрібні Chrome або Edge та кабель USB-C із даними.</p>
<input type="file" id="file" accept="image/*">
<canvas id="cv" width="466" height="466"></canvas>
<label>Масштаб <input type="range" id="zoom" min="1" max="4" step="0.01" value="1"></label>
<label>Яскравість (менше — текст читається краще) <input type="range" id="dim" min="0.2" max="1" step="0.01" value="0.6"></label>
<label>Адреса у flash <input type="text" id="addr" value="0x920000"> (брелок показує її в логу та у відповіді на <code>config</code>)</label>
<button id="go" disabled>Прошити шпалери</button><button id="clear" class="g">Прибрати шпалери</button>
<pre id="log"></pre>
<script type="module">
import { ESPLoader, Transport } from "https://unpkg.com/esptool-js@0.6.1/bundle.js";
const S = 466, cv = document.getElementById("cv"), cx = cv.getContext("2d"), log = document.getElementById("log");
const $ = id => document.getElementById(id);
let img = null, ox = 0, oy = 0; // ox, oy: the shift of the photo's centre, in screen pixels
const say = t => (log.textContent += t + "\n");

function scale() { return Math.max(S / img.width, S / img.height) * +$("zoom").value; }
function draw(target = cx) {
  target.fillStyle = "#000"; target.fillRect(0, 0, S, S);
  if (!img) return;
  const k = scale(), w = img.width * k, h = img.height * k;
  ox = Math.max(-(w - S) / 2, Math.min((w - S) / 2, ox)); oy = Math.max(-(h - S) / 2, Math.min((h - S) / 2, oy));
  target.drawImage(img, (S - w) / 2 + ox, (S - h) / 2 + oy, w, h);
  target.fillStyle = `rgba(0,0,0,${1 - $("dim").value})`; target.fillRect(0, 0, S, S); // the preview shows the dimming too
}
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  img = await createImageBitmap(f, { imageOrientation: "from-image" }); ox = oy = 0; $("go").disabled = false; draw();
};
$("zoom").oninput = $("dim").oninput = () => draw();
let drag = null;
cv.onpointerdown = e => { drag = [e.clientX, e.clientY, ox, oy]; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => { if (!drag) return; const f = S / cv.clientWidth; ox = drag[2] + (e.clientX - drag[0]) * f; oy = drag[3] + (e.clientY - drag[1]) * f; draw(); };
cv.onpointerup = () => (drag = null);

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.5);
function fnv1a(b) { let h = 2166136261; for (let i = 0; i < b.length; i++) h = Math.imul(h ^ b[i], 16777619) >>> 0; return h; }
function build() { // ui/wallpaper.h: 16-byte header, then RGB565 little endian (the same as tools/wallpaper.py)
  const c = document.createElement("canvas"); c.width = c.height = S;
  const t = c.getContext("2d"); const keep = $("dim").value; // dimming is applied below on the numbers, not by painting
  const prev = $("dim").value; $("dim").value = 1; draw(t); $("dim").value = prev; draw();
  const a = t.getImageData(0, 0, S, S).data, px = new Uint8Array(S * S * 2), dim = +keep;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = (y * S + x) * 4, d = BAYER[(y & 3) * 4 + (x & 3)];
    const r = Math.max(0, Math.min(31, Math.floor(a[i] * dim / 8 + d + 0.5)));
    const g = Math.max(0, Math.min(63, Math.floor(a[i + 1] * dim / 4 + d + 0.5)));
    const b = Math.max(0, Math.min(31, Math.floor(a[i + 2] * dim / 8 + d + 0.5)));
    const v = r << 11 | g << 5 | b, o = (y * S + x) * 2; px[o] = v & 255; px[o + 1] = v >> 8;
  }
  const out = new Uint8Array(16 + px.length), dv = new DataView(out.buffer);
  out.set([0x50, 0x57, 0x4c, 0x31]); dv.setUint16(4, S, true); dv.setUint16(6, S, true);
  dv.setUint32(8, px.length, true); dv.setUint32(12, fnv1a(px), true); out.set(px, 16);
  return out;
}
async function flash(data) {
  const addr = parseInt($("addr").value, 16);
  if (!navigator.serial) { say("Цей браузер не вміє працювати з USB: відкрийте сторінку в Chrome або Edge."); return; }
  const port = await navigator.serial.requestPort({ filters: [{ usbVendorId: 0x303a }] });
  const transport = new Transport(port, true);
  const loader = new ESPLoader({ transport, baudrate: 921600, romBaudrate: 115200,
    terminal: { clean() {}, writeLine: t => say(t), write: t => (log.textContent += t) } });
  try {
    say("З'єднання…"); await loader.main();
    await loader.writeFlash({ fileArray: [{ data, address: addr }], flashSize: "keep", flashMode: "keep", flashFreq: "keep",
      eraseAll: false, compress: true, reportProgress: (i, w, t) => (log.textContent = `Запис: ${Math.round(100 * w / t)} %\n`) });
    /* 0.6.1 hard_reset лише відпускає RTS: тягнемо EN вниз самі, DTR низько = звичайний запуск */
    await transport.setDTR(false); await transport.setRTS(true);
    await new Promise(r => setTimeout(r, 150)); await transport.setRTS(false);
    say("Готово: брелок перезапускається. Фото з’явиться після запуску.");
  } catch (e) { say("Помилка: " + e + "\nЯкщо запис не починається: затисніть нижню кнопку, коротко натисніть верхню й відпустіть нижню, потім спробуйте ще раз."); }
  finally { try { await transport.disconnect(); } catch (_) {} }
}
$("go").onclick = () => flash(build());
$("clear").onclick = () => flash(new Uint8Array(4096).fill(0xff));
</script></body></html>
